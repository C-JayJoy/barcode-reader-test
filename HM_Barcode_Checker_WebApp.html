<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HM Barcode Checker</title>
<style>
  :root{
    --navy:#0B3352;
    --navy-2:#0F4B79;
    --blue:#1C7ED6;
    --blue-dark:#125a9c;
    --bg:#EEF2F5;
    --card:#FFFFFF;
    --line:#D7DEE4;
    --ink:#1B222B;
    --ink-soft:#5B6672;
    --ok:#1B7A4D;
    --ok-bg:#E4F4EC;
    --ng:#C4292F;
    --ng-bg:#FBE7E7;
    --amber:#B8860B;
    --mono: 'SFMono-Regular', ui-monospace, Menlo, Consolas, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-text-size-adjust:100%; height:100%;}
  body{padding-bottom:calc(84px + var(--safe-b));}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff; padding:calc(12px + var(--safe-t)) 16px 12px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 10px rgba(11,51,82,.35);
  }
  header svg{flex:0 0 auto;}
  header .htext{flex:1; min-width:0;}
  header .htitle{font-size:16px; font-weight:700; letter-spacing:.2px; line-height:1.25;}
  header .hsub{font-size:11px; color:#A9C6DE; margin-top:1px; font-family:var(--mono);}
  header .langBtn{
    flex:0 0 auto; background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600;
  }

  /* ---------- Views ---------- */
  .view{display:none; padding:14px 14px 6px;}
  .view.active{display:block;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:14px;}
  .card .cardTitle{
    background:#F5F8FA; color:var(--navy); font-weight:700; font-size:13px;
    padding:9px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .card .cardBody{padding:12px 14px;}

  /* input row */
  .inputRow{display:flex; gap:8px;}
  .inputRow input[type=text]{
    flex:1; min-width:0; font-family:var(--mono); font-size:14px; padding:11px 12px;
    border:1.5px solid var(--line); border-radius:9px; background:#FAFBFC; color:var(--ink);
  }
  .inputRow input[type=text]:focus{outline:none; border-color:var(--blue); background:#fff;}
  .inputRow button{
    flex:0 0 auto; background:var(--blue); color:#fff; border:none; border-radius:9px;
    padding:0 16px; font-weight:700; font-size:13px;
  }
  .inputHint{font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5;}

  .camBtn{
    margin-top:10px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:#fff; color:var(--blue-dark); border:1.5px solid var(--blue); border-radius:9px;
    padding:10px; font-weight:700; font-size:13.5px;
  }
  .camBtn:disabled{opacity:.4;}

  /* memo (raw barcode content) */
  .memo{
    font-family:var(--mono); font-size:13px; line-height:1.7; background:#FAFBFC;
    border:1px solid var(--line); border-radius:9px; padding:12px; min-height:44px;
    word-break:break-all; white-space:pre-wrap;
  }
  .memo .gs{color:#C4292F; font-weight:700;}
  .memo .rs{color:#1B7A4D; font-weight:700;}
  .memo .eot{color:#125a9c; font-weight:700;}
  .memo .selected{background:#FFF3B0; border-radius:3px;}

  /* tabs */
  .tabRow{display:flex; gap:6px; overflow-x:auto; padding:10px 14px 0; margin:-4px 0 4px;}
  .tabRow button{
    flex:0 0 auto; background:#fff; border:1.5px solid var(--line); color:var(--ink-soft);
    border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700;
  }
  .tabRow button.selected{background:var(--amber); border-color:var(--amber); color:#fff;}

  /* result table */
  table.res{width:100%; border-collapse:collapse; font-size:13px;}
  table.res th, table.res td{border:1px solid var(--line); padding:8px 7px; vertical-align:middle;}
  table.res th{background:#F5F8FA; font-weight:700; color:var(--navy); text-align:center; font-size:12px;}
  table.res td.dt{font-family:var(--mono); word-break:break-all; font-size:12.5px;}
  table.res td.ct{text-align:center; width:44px;}
  .chip{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:800;}
  .chip.OK{background:var(--ok-bg); color:var(--ok);}
  .chip.NG{background:var(--ng-bg); color:var(--ng);}
  .gray{color:#9AA5B1; font-weight:600; font-size:11.5px;}

  /* history */
  .histItem{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center;}
  .histItem:last-child{border-bottom:none;}
  .histItem .hInfo{flex:1; min-width:0;}
  .histItem .hDate{font-size:11px; color:var(--ink-soft); margin-bottom:3px;}
  .histItem .hData{font-family:var(--mono); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .histItem .hView{flex:0 0 auto; background:#F5F8FA; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; color:var(--navy);}
  .noData{padding:36px 14px; text-align:center; color:var(--ink-soft); font-size:13px;}

  /* bottom bar */
  .bottomBar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; gap:8px; padding:10px 14px calc(10px + var(--safe-b));
    background:#fff; border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(0,0,0,.05);
  }
  .bottomBar button{
    flex:1; padding:12px 0; border-radius:10px; border:none; font-weight:800; font-size:13px;
  }
  .bottomBar .primary{background:var(--blue); color:#fff;}
  .bottomBar .ghost{background:#F5F8FA; color:var(--navy); border:1px solid var(--line);}

  /* camera modal */
  .camModal{position:fixed; inset:0; background:#000; z-index:100; display:none; flex-direction:column;}
  .camModal.active{display:flex;}
  .camModal .camHead{
    color:#fff; padding:calc(14px + var(--safe-t)) 16px 12px; display:flex; justify-content:space-between; align-items:center;
    background:rgba(0,0,0,.5);
  }
  .camModal .camHead button{background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:8px 14px; font-weight:700; font-size:13px;}
  #reader{flex:1; width:100%;}
  .camMsg{color:#ddd; text-align:center; padding:16px; font-size:13px; line-height:1.6;}

  .toast{
    position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%);
    background:rgba(20,26,32,.94); color:#fff; padding:10px 18px; border-radius:24px; font-size:13px;
    z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:88%; text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="2.4" height="16" fill="#fff"/><rect x="6" y="4" width="1.2" height="16" fill="#fff"/><rect x="8.5" y="4" width="2.4" height="16" fill="#fff"/><rect x="12.5" y="4" width="1.2" height="16" fill="#fff"/><rect x="15" y="4" width="2.4" height="16" fill="#fff"/><rect x="19" y="4" width="1.2" height="16" fill="#fff"/><rect x="21" y="4" width="1" height="16" fill="#fff"/></svg>
  <div class="htext">
    <div class="htitle" data-label="appTitle">HM 바코드 체커</div>
    <div class="hsub" data-label="appSub">H/KMC부품 2D 바코드 표준</div>
  </div>
  <button class="langBtn" id="btnLang">EN</button>
</header>

<!-- ============ SCAN VIEW ============ -->
<div class="view active" id="scanView">

  <div class="card">
    <div class="cardTitle" data-label="lblInput">바코드 데이터 입력</div>
    <div class="cardBody">
      <div class="inputRow">
        <input type="text" id="scanInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-ph="phInput" placeholder="스캐너로 스캔하거나 직접 붙여넣기">
        <button id="btnGo" data-label="lblCheck">확인</button>
      </div>
      <div class="inputHint" data-label="hintInput">블루투스/USB 스캐너를 이 화면에 연결하면 입력창에 자동으로 채워집니다. 카메라로도 스캔할 수 있습니다.</div>
      <button class="camBtn" id="btnCamera">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.3"/></svg>
        <span data-label="lblCamScan">카메라로 스캔</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="cardTitle" data-label="lblRawContent">바코드 내용</div>
    <div class="cardBody">
      <div class="memo" id="txtResult"></div>
    </div>
  </div>

  <div class="tabRow" id="tabRow" style="display:none;"></div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="cardTitle" data-label="lblStandard">H/KMC부품 2D 바코드 표준</div>
    <div class="cardBody" style="padding:0;">
      <table class="res">
        <tr>
          <th colspan="2" data-label="c_gubun">구분</th>
          <th data-label="c_result">결과</th>
          <th data-label="c_data">Data</th>
        </tr>
        <tr>
          <th colspan="2" data-label="c_header">Header</th>
          <td class="ct" id="result00"></td>
          <td class="dt" id="data00"></td>
        </tr>
        <tr>
          <th rowspan="4" id="title_m10" data-label="c_spec">사양<br>정보</th>
          <th data-label="c_vendor">업체코드</th>
          <td class="ct" id="result10"></td>
          <td class="dt" id="data10"></td>
        </tr>
        <tr>
          <th data-label="c_partno">부품번호</th>
          <td class="ct" id="result11"></td>
          <td class="dt" id="data11"></td>
        </tr>
        <tr>
          <th data-label="c_seq">서열코드</th>
          <td class="ct" id="result12"></td>
          <td class="dt" id="data12"></td>
        </tr>
        <tr id="tr13">
          <th data-label="c_eo">EO번호</th>
          <td class="ct" id="result13"></td>
          <td class="dt" id="data13"></td>
        </tr>
        <tr>
          <th rowspan="4" data-label="c_trace">추적<br>정보</th>
          <th data-label="c_pdate">생산일자</th>
          <td class="ct" id="result20"></td>
          <td class="dt" id="data20"></td>
        </tr>
        <tr>
          <th data-label="c_4m">부품4M</th>
          <td class="ct" id="result21"></td>
          <td class="dt" id="data21"></td>
        </tr>
        <tr>
          <th data-label="c_aat">A or @</th>
          <td class="ct" id="result22"></td>
          <td class="dt" id="data22"></td>
        </tr>
        <tr>
          <th data-label="c_traceno">추적번호(7~)</th>
          <td class="ct" id="result23"></td>
          <td class="dt" id="data23"></td>
        </tr>
        <tr id="tr30">
          <th rowspan="2" id="title_m30" data-label="c_add">부가<br>정보</th>
          <th data-label="c_special">특이정보</th>
          <td class="ct" id="result30"></td>
          <td class="dt" id="data30"></td>
        </tr>
        <tr id="tr31">
          <th id="title_m31" data-label="c_add" style="display:none;"></th>
          <th data-label="c_initial">초도품구분</th>
          <td class="ct" id="result31"></td>
          <td class="dt" id="data31"></td>
        </tr>
        <tr id="tr40">
          <th data-label="c_etc">기타</th>
          <th data-label="c_vendorarea">업체영역</th>
          <td class="ct" id="result40"></td>
          <td class="dt" id="data40"></td>
        </tr>
        <tr>
          <th colspan="2" data-label="c_trailer">Trailer</th>
          <td class="ct" id="result50"></td>
          <td class="dt" id="data50"></td>
        </tr>
      </table>
    </div>
  </div>
</div>

<!-- ============ HISTORY VIEW ============ -->
<div class="view" id="historyView">
  <div class="card">
    <div class="cardTitle" data-label="lblHistory">바코드 이력</div>
    <div class="cardBody" style="padding:0;" id="historyList">
      <div class="noData" data-label="lblNoData">*** 등록된 데이터가 없습니다 ***</div>
    </div>
  </div>
</div>

<!-- ============ BOTTOM BAR ============ -->
<div class="bottomBar" id="bottomBar">
  <button class="ghost" id="btnHistory" data-label="lblHistBtn">이력</button>
  <button class="primary" id="btnScanBtn" data-label="lblScanBtn">스캔</button>
</div>
<div class="bottomBar" id="bottomBarHistory" style="display:none;">
  <button class="ghost" id="btnClear" data-label="lblClear">전체삭제</button>
  <button class="primary" id="btnClose" data-label="lblClose">닫기</button>
</div>

<!-- ============ CAMERA MODAL ============ -->
<div class="camModal" id="camModal">
  <div class="camHead">
    <span data-label="lblCamTitle" style="font-weight:700;">카메라로 스캔</span>
    <button id="btnCamClose" data-label="lblClose">닫기</button>
  </div>
  <div id="reader"></div>
  <div class="camMsg" id="camMsg" data-label="camMsgDefault">바코드를 사각형 안에 맞춰주세요.</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   1) DataAnalyzer  -- 원본 HMBarcodeChecker(Cordova) 앱의 검증 로직 그대로 이식
   ========================================================================= */
function DataAnalyzer() {
    var _barcodeData = [];
    var _barcodeDataList = [];
    var _barcodeResultData = [];
    var _barcodeDataStr = "";
    var _barcodeCount = 0;
    var _selectedIndex = 0;

    this.setBarcodeData = function(strData) {
        _barcodeData = [];
        _barcodeDataList = [];
        _barcodeResultData = [];
        _selectedIndex = 0;
        _barcodeCount = 0;
        _barcodeDataStr = strData;
        setArrayFromString(strData);
        setSharpDivide();
    };
    this.setSelectIndex = function(index) { _selectedIndex = index; };
    this.getFullViewData = function() { return getCodeFromArray(); };
    this.getCount = function() { return _barcodeCount; };
    this.getCheckResult = function() { return getDataCheckResult(); };
    this.getResultData = function() { return _barcodeResultData; };
    this.getSelectedIndex = function() { return _selectedIndex; };

    function setSharpDivide(){
        var rowData = [];
        _barcodeData.forEach(function(v){
            rowData.push(v);
            if (v == 35) { _barcodeDataList.push(rowData); rowData = []; _barcodeCount += 1; }
        });
        if (rowData.length > 0) { _barcodeDataList.push(rowData); _barcodeCount += 1; }
    }
    function getCodeFromArray(){
        var rtnData = "";
        _barcodeDataList.forEach(function(valRow,indexRow){
            if (indexRow == _selectedIndex) rtnData += "<span class='selected'>";
            valRow.forEach(function(v){ rtnData += getCodeToChar(v); });
            if (indexRow == _selectedIndex) rtnData += "</span>";
        });
        return rtnData;
    }
    function getCodeFromArrayData(arrData){
        var rtnData = "";
        if (typeof arrData === "number") {
            rtnData = getCodeToChar(arrData);
        } else if (arrData) {
            arrData.forEach(function(v){ rtnData += getCodeToChar(v); });
        }
        return rtnData;
    }
    function setArrayFromString(str){
        _barcodeData = [];
        for (var i=0;i<str.length;i++){
            if (str.charCodeAt(i) != 32) _barcodeData.push(str.charCodeAt(i));
        }
    }
    function getCodeToChar(v){
        var tmp;
        if (v == 29){ tmp = "<span class='gs'><sup>G</sup><sub>S</sub></span>"; }
        else if (v == 30) { tmp = "<span class='rs'><sup>R</sup><sub>S</sub></span>"; }
        else if (v == 4){ tmp = "<span class='eot'><sup>E</sup>O<sub>T</sub></span>"; }
        else if (v == 35) { tmp = "#<br>"; }
        else {
            if (v >= 0 && v <=32 || v == 127) tmp = "&#60;0x" + lpad(v.toString(16).toUpperCase(),2) + "&#62;";
            else tmp = String.fromCharCode(v);
        }
        return tmp;
    }
    function getDataCheckResult() {
        var result = true;
        _barcodeResultData = [];
        _barcodeDataList.forEach(function(rowData,rowIndex){
            var ex_00=false, ex_10=false, ex_11=false, ex_12=false, ex_13=false;
            var ex_20=false, ex_21=false, ex_22=false, ex_23=false;
            var ex_30=false, ex_31=false, ex_40=false, ex_50=false;

            if (rowData.length >= 7) {
                if (rowData[0]==91 && rowData[1]==41 && rowData[2]==62 && rowData[3]==30 && rowData[4]==48 && rowData[5]==54 && rowData[6]==29) {
                    ex_00 = true; setAddDetail("00", true, rowData.slice(0,6), rowIndex);
                } else if (rowData[0]==91) {
                    var cutIndex=-1;
                    rowData.some(function(v,i){ if (v==29){ cutIndex=i; return true; } });
                    if (cutIndex>0) { ex_00=true; setAddDetail("00", false, rowData.slice(0,cutIndex), rowIndex); }
                }
            } else { result = false; }

            if (rowData[rowData.length-1]==35 || rowData[rowData.length-1]==4) {
                ex_50 = true;
                if (rowData[rowData.length-4]==29 && rowData[rowData.length-3]==30 && rowData[rowData.length-2]==4 && rowData[rowData.length-1]==35) {
                    setAddDetail("50", true, rowData.slice(rowData.length-3, rowData.length-1), rowIndex);
                } else if (rowData[rowData.length-3]==29 && rowData[rowData.length-2]==30 && rowData[rowData.length-1]==4) {
                    setAddDetail("50", true, rowData.slice(rowData.length-2), rowIndex);
                } else {
                    result = false;
                    var cutIndex=-1;
                    for (var x=rowData.length; x>0; x--){ if (rowData[x]==29){ cutIndex=x+1; break; } }
                    setAddDetail("50", false, rowData.slice(cutIndex), rowIndex);
                }
            }

            getCheckArrayData(rowData).forEach(function(partData){
                if (partData[0]==86) {
                    ex_10=true;
                    if (partData.length==5) setAddDetail("10", true, partData.slice(1), rowIndex);
                    else { result=false; setAddDetail("10", false, partData.slice(1), rowIndex); }
                } else if (partData[0]==80) {
                    ex_11=true;
                    if (partData.length>10 && partData.length<17) {
                        if (!chkHaveCode(partData, 45)) setAddDetail("11", true, partData.slice(1), rowIndex);
                        else setAddDetail("11", false, partData.slice(1), rowIndex);
                    } else { result=false; setAddDetail("10", false, partData.slice(1), rowIndex); }
                } else if (partData[0]==83) {
                    ex_12=true;
                    if (partData.length>0 && partData.length<10) setAddDetail("12", true, partData.slice(1), rowIndex);
                    else { result=false; setAddDetail("12", false, partData.slice(1), rowIndex); }
                } else if (partData[0]==69) {
                    ex_13=true;
                    if (partData.length>8 && partData.length<11) setAddDetail("13", true, partData.slice(1), rowIndex);
                    else if (partData.length==1) setAddDetail("13", true, partData.slice(1), rowIndex);
                    else { result=false; setAddDetail("13", false, partData.slice(1), rowIndex); }
                } else if (partData[0]==84) {
                    if (partData.length>6) {
                        ex_20=true;
                        if (chkValidDate(partData.slice(1,7))) setAddDetail("20", true, partData.slice(1,7), rowIndex);
                        else { result=false; setAddDetail("20", false, partData.slice(1,7), rowIndex); }
                    }
                    if (partData.length>7) {
                        ex_21=true;
                        if (partData.length>10) setAddDetail("21", true, partData.slice(7,11), rowIndex);
                        else { result=false; setAddDetail("21", false, partData.slice(7), rowIndex); }
                    }
                    if (partData.length>11) {
                        ex_22=true;
                        if (partData[11]==64 || partData[11]==65) setAddDetail("22", true, partData[11], rowIndex);
                        else { result=false; setAddDetail("22", false, partData[11], rowIndex); }
                    }
                    if (partData.length>12) {
                        ex_23=true;
                        setAddDetail("23", true, partData.slice(12), rowIndex);
                    }
                } else if (partData[0]>48 && partData[0]<58) {
                    ex_30=true;
                    if (partData.length>1 && partData.length<42) setAddDetail("30", true, partData.slice(2), rowIndex);
                    else { result=false; setAddDetail("30", false, partData.slice(2), rowIndex); }
                } else if (partData[0]==77) {
                    ex_31=true;
                    if (partData.length==1) setAddDetail("31", true, partData[1], rowIndex);
                    else if (partData.length==2) {
                        if (partData[1]==89 || partData[1]==78) setAddDetail("31", true, partData[1], rowIndex);
                        else { result=false; setAddDetail("31", false, partData[1], rowIndex); }
                    } else { result=false; setAddDetail("31", false, partData[1], rowIndex); }
                } else if (partData[0]==67) {
                    ex_40=true;
                    if (partData.length>0 && partData.length<52) setAddDetail("40", true, partData.slice(1), rowIndex);
                    else { result=false; setAddDetail("40", false, partData.slice(1), rowIndex); }
                }
            });

            if (!ex_00) { result=false; setAddDetail("00", false, getFirstBlockData(rowData), rowIndex); }
            if (!ex_10) { result=false; setAddDetail("10", false, null, rowIndex); }
            if (!ex_11) { result=false; setAddDetail("11", false, null, rowIndex); }
            if (!ex_12) { setAddDetail("12", true, null, rowIndex); }
            if (!ex_20) { result=false; setAddDetail("20", false, null, rowIndex); }
            if (!ex_21) { result=false; setAddDetail("21", false, null, rowIndex); }
            if (!ex_22) { result=false; setAddDetail("22", false, null, rowIndex); }
            if (!ex_23) { result=false; setAddDetail("23", false, null, rowIndex); }
            if (!ex_50) { result=false; setAddDetail("50", false, getLastBlockData(rowData), rowIndex); }
        });
        return result;
    }
    function setAddDetail(type, okng, dispData, rowIndex) {
        if (_selectedIndex == rowIndex) {
            if (type != "00" && type != "50") { if (chkBadASCIICode(dispData)) okng = false; }
            var strOKNG = okng ? "<span class='chip OK'>OK</span>" : "<span class='chip NG'>NG</span>";
            _barcodeResultData.push([type, strOKNG, dispData != null ? getCodeFromArrayData(dispData) : null]);
        }
    }
    function getCheckArrayData(arrData) {
        var rtnData = []; var rowData = [];
        arrData.forEach(function(v){
            if (v == 29) { rtnData.push(rowData.slice(0)); rowData = []; }
            else { rowData.push(v); }
        });
        return rtnData;
    }
    function chkHaveCode(arrData, chkCode) { return arrData.some(function(v){ return v == chkCode; }); }
    function chkValidDate(arrData) {
        var strDate = "";
        arrData.forEach(function(v){ strDate += String.fromCharCode(v); });
        var df = /[0-9]{2}[0-1]{1}[0-9]{1}[0-9]{2}/;
        var m_last_day = [31,28,31,30,31,30,31,31,30,31,30,31];
        if (!strDate.match(df)) return false;
        var year = Number("20" + strDate.substr(0,2));
        var month = Number(strDate.substr(2,2));
        var day = Number(strDate.substr(4,2));
        if (month > 12) return false;
        if (day == 0) return false;
        if ((year % 4 == 0) && ((year % 100 != 0) || (year % 400 == 0))) {
            if (month == 2) { if (day <= m_last_day[month-1] + 1) return true; }
            else { if (day <= m_last_day[month-1]) return true; }
        } else { if (day <= m_last_day[month-1]) return true; }
        return false;
    }
    function lpad(n, width) { n = n + ''; return n.length >= width ? n : new Array(width - n.length + 1).join('0') + n; }
    function getFirstBlockData(arrData){
        var cutIndex=-1;
        arrData.some(function(v,i){ if (v==29){ cutIndex=i; return true; } });
        return arrData.slice(0, cutIndex);
    }
    function getLastBlockData(arrData){
        var cutIndex=-1;
        for (var x=arrData.length; x>0; x--){ if (arrData[x]==29){ cutIndex=x+1; break; } }
        return arrData.slice(cutIndex);
    }
    function chkBadASCIICode(arrData){
        if (arrData == null) return false;
        if (arrData.length === 0) return false;
        if (typeof arrData === "number") {
            var v = arrData;
            if (v<47) return true; if (v>57 && v<65) return true; if (v>90 && v<97) return true; if (v>122) return true;
            return false;
        }
        for (var i=0;i<arrData.length;i++){
            var v2 = arrData[i];
            if (v2<47) return true; if (v2>57 && v2<65) return true; if (v2>90 && v2<97) return true; if (v2>122) return true;
        }
        return false;
    }
}

var dataAnalyzer = new DataAnalyzer();
var HIST_KEY = "bc_history";
var HIST_MAX = 49;

function setBarcodeSet(){
  document.getElementById("txtResult").innerHTML = dataAnalyzer.getFullViewData();
  setTabShowHidden(dataAnalyzer.getCount());
  return setBarcodeResultDetail();
}

function setTabShowHidden(cnt){
  var tabRow = document.getElementById("tabRow");
  if (cnt > 1) {
    var html = "";
    var sel = dataAnalyzer.getSelectedIndex();
    var labels = ["Assy","Sub01","Sub02","Sub03","Sub04"];

      html += "<button data-idx='"+i+"' class='"+(i===sel?"selected":"")+"'>"+labels[i]+"</button>";
    }
    tabRow.innerHTML = html;
    tabRow.style.display = "flex";
    Array.prototype.forEach.call(tabRow.querySelectorAll("button"), function(btn){
      btn.onclick = function(){
        dataAnalyzer.setSelectIndex(parseInt(this.getAttribute("data-idx"),10));
        setBarcodeSet();
      };
    });
  } else {
    tabRow.style.display = "none";
    tabRow.innerHTML = "";
  }
}

var FIELD_IDS = ["00","10","11","12","13","20","21","22","23","30","31","40","50"];

    document.getElementById("result"+id).innerHTML = "";

  });
}

function setBarcodeResultDetail(){
  setAllClear();

function processBarcode(text){
  if (!text || !text.trim()) { showToast(t("toastEmpty")); return; }

}

/* ---- 이력 (localStorage 기반, 원본 SQLite 로직과 동일한 정책: 최신 49건 유지) ---- */
function loadHistory(){
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; }
  catch(e){ return []; }
}
function saveHistory(list){ localStorage.setItem(HIST_KEY, JSON.stringify(list)); }
function addHistory(data, okng){
  var list = loadHistory();
  var d = new Date();
  var pad = function(n){ return (n<10?"0":"")+n; };
  var dateStr = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  list.unshift({ date: dateStr, data: data, okng: okng ? "OK" : "NG" });
  if (list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
  saveHistory(list);
}
function clearHistory(){ saveHistory([]); renderHistory(); }
function renderHistory(){
  var list = loadHistory();
  var el = document.getElementById("historyList");
  if (list.length === 0) {
    el.innerHTML = "<div class='noData'>" + t("lblNoData") + "</div>";
    return;
  }
  var html = "";
  list.forEach(function(item, idx){
    html += "<div class='histItem'>"
          + "<span class='chip " + item.okng + "'>" + item.okng + "</span>"
          + "<div class='hInfo'><div class='hDate'>" + item.date + "</div><div class='hData'>" + escapeHtml(item.data) + "</div></div>"
          + "<button class='hView' data-idx='" + idx + "'>" + t("viewBtn") + "</button>"
          + "</div>";
  });
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll(".hView"), function(btn){
    btn.onclick = function(){
      var list2 = loadHistory();
      var item = list2[parseInt(this.getAttribute("data-idx"),10)];
      if (item) {
        document.getElementById("scanInput").value = item.data;
        showView("scanView");
        processBarcode(item.data);
      }
    };
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---- 화면 전환 ---- */
function showView(id){
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
  document.getElementById("bottomBar").style.display = (id === "scanView") ? "flex" : "none";
  document.getElementById("bottomBarHistory").style.display = (id === "historyView") ? "flex" : "none";
  if (id === "scanView") { setTimeout(function(){ document.getElementById("scanInput").focus(); }, 50); }
  if (id === "historyView") { renderHistory(); }
}

/* =========================================================================
   4) 카메라 스캔 (html5-qrcode, CDN에서 지연 로드 — 실패 시 자동 비활성화)
   ========================================================================= */
var html5QrCode = null;
var camLibLoaded = false;
var camLibLoading = false;

function loadCamLib(cb){
  if (camLibLoaded) { cb(true); return; }
  if (camLibLoading) {
    var check = setInterval(function(){
      if (camLibLoaded) { clearInterval(check); cb(true); }
    }, 200);
    setTimeout(function(){ clearInterval(check); if(!camLibLoaded) cb(false); }, 6000);
    return;
  }
  camLibLoading = true;
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js";
  s.onload = function(){ camLibLoaded = true; camLibLoading = false; cb(true); };
  s.onerror = function(){ camLibLoading = false; cb(false); };
  document.head.appendChild(s);
}

function openCamera(){
  document.getElementById("camModal").classList.add("active");
  document.getElementById("camMsg").textContent = t("camMsgDefault");
  loadCamLib(function(ok){
    if (!ok || typeof Html5Qrcode === "undefined") {
      showToast(t("toastLibFail"));
      closeCamera();
      return;
    }
    try {
      html5QrCode = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.UPC_A
        ]
      });
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 200 } },
        function onScan(decodedText){
          closeCamera();
          document.getElementById("scanInput").value = decodedText;
          processBarcode(decodedText);
        },
        function onScanFail(){ /* per-frame decode miss — ignore */ }
      ).catch(function(err){
        showToast(t("toastCamFail"));
        closeCamera();
      });
    } catch(e){
      showToast(t("toastCamFail"));
      closeCamera();
    }
  });
}
function closeCamera(){
  document.getElementById("camModal").classList.remove("active");
  if (html5QrCode) {
    try {
      html5QrCode.stop().then(function(){ html5QrCode.clear(); }).catch(function(){});
    } catch(e){}
  }
}

document.addEventListener("DOMContentLoaded", function(){
  applyLanguage();

  });

  document.getElementById("btnCamera").addEventListener("click", openCamera);
  document.getElementById("btnScanBtn").addEventListener("click", openCamera);
  document.getElementById("btnCamClose").addEventListener("click", closeCamera);

  document.getElementById("btnHistory").addEventListener("click", function(){ showView("historyView"); });
  document.getElementById("btnClose").addEventListener("click", function(){ showView("scanView"); });
  document.getElementById("btnClear").addEventListener("click", function(){
    clearHistory();
